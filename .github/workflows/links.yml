name: Check external links

on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install Markdown parser
        run: python -m pip install markdown-it-py==3.0.0
      - name: Extract external URLs from Markdown and notebook prose
        run: python scripts/check_links.py --external-output "${{ runner.temp }}/external-links.txt"
      - name: Check external URLs with Lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress --timeout 30 --max-retries 2 --max-concurrency 4
            "${{ runner.temp }}/external-links.txt"
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
